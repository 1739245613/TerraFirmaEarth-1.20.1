[[mods]]
modId = "tfe"
version = "${file.jarVersion}"
displayName = "TerraFirmaEarth"
authors = "交错次元"
credits = "修正和测试: witzig_heidi(鱼) | 谢鸣: 10MeV(尘梦)"
description = '''
TerraFirmaEarth / 群峦地球

面向 Minecraft 1.20.1 Forge 的 TerraFirmaCraft 附属模组。把高版本 TFC 的新地形与新内容反向移植到 1.20，让因依赖锁定无法升级 1.21 的整合包和玩家也能体验到。

移植自高版本 TFC 的内容
- 积雪逻辑移植，积雪现在是在对应的气候立即生效，冬天外出不会慢慢积雪，夏天外出不会慢慢化雪。
- 新版地形地貌和过渡：完整移植109种.
- 气候与季节：新的气候(总共31种)与面板日历显示、运行时天气与降雨判定。
- 植物季相：树叶、花草、莲花、向日葵等的动态季相外观(风景美化)。
- 作物与农田杂草花朵：完整移植.
- 新生物与刷新：野牛、海豹等新生物按高版本气候口径接入；北极熊、冰原狼按高版本气候口径运行。
- 害虫系统：跟随气候变化的多种老鼠。
- 手册条目：在 TFC 手册首页新增"群峦地球 / New Terra Earth"独立分类，比较粗糙，拿来查看作物生长条件。

额外的内容
- 果树作物灌木等湿度，直接取决于当前降雨量，且可以读取环境水源。
- 海洋深度加深：自行重写的连续加深算法，让普通海、珊瑚海、深海、海沟从浅到深平滑过渡，海沟核心区会渐降到更深处。
- 高低版本兼容层：让高版本的生物、气候、植物等数据在 1.20 端正常工作，兼容了1.20提前注册的物品。
- AFC 兼容：兼容林海传说
- 地图mod 兼容。
- FirmalifeEnhanced 温室地窖重置兼容(0.1.3以上版本)：在受控温室范围内，作物、果树、浆果灌木等会按年均温度和湿度判定，不受外部天气影响。
- 数据包接入说明：随附github上的《数据包兼容写法教程》，方便整合包作者添加生物刷新、追加 fauna、协调 AFC 兼容。

授权与声明
- 本模组当前为测试版本，按现状（"as is"）发布，不承诺持续更新与维护。
- 本模组的代码部分按 EUPL v1.2（European Union Public Licence v1.2）发布。
- 本模组的美术 / 模型 / 数据包 JSON 等资源部分按 CC BY-SA 4.0 发布。
- 本模组是 TerraFirmaCraft (TFC, EUPL v1.2 / CC BY-SA 4.0) 的衍生作品，按 EUPL Copyleft 条款继承上游协议。
- 第三方传播本模组时仍须遵守 EUPL v1.2 与 CC BY-SA 4.0 的署名、Copyleft / Share-Alike 与提供源代码等义务。
- 完整条款详见随附 LICENSE / NOTICE / DISCLAIMER.md。

English Summary
TerraFirmaEarth is a back-port addon for TerraFirmaCraft on Minecraft 1.20.1 Forge. It brings the newer-version TFC content to 1.20, including:

Ported from newer TFC versions
- Snow logic: snow accumulation and melting now react to climate immediately — no more slowly building up in winter or slowly melting in summer.
- Full set of new terrain biomes and transitions: 109 biomes ported.
- Climate and seasons: 31 climate types ported, with the new climate panel and calendar display, runtime weather and rainfall.
- Seasonal plants: dynamic seasonal appearance for leaves, flowers, lotus, sunflower and more (visual polish).
- Crops, farmland, weeds and flowers: fully ported.
- New fauna and spawning: bison, leopard seal and other new mobs follow newer-version climate rules; polar bear and dire wolf also run on newer climate logic.
- Pest system: multiple climate-driven rodents (lemming / mongoose / jerboa).
- Field guide: a dedicated "TerraFirmaEarth / 群峦地球" category added to the TFC field guide — fairly rough, mainly intended for looking up crop growth conditions.

Extras
- Crops, fruit trees and bushes draw their hydration directly from current rainfall, and can read nearby water sources.
- Rewritten ocean depth curve: smooth transitions across ocean / reef / deep ocean / trench, with the trench core gradually descending deeper.
- High-version-to-1.20 compatibility layer: makes newer-version fauna, climate and plant data work cleanly on 1.20, including handling items already registered on the 1.20 side.
- AFC compatibility: works with Another Forest Compat (林海传说).
- Map mod compatibility (e.g. JourneyMap colour support for ported terrain).
- FirmalifeEnhanced greenhouse / cellar reset compatibility (requires FirmalifeEnhanced 0.1.3 or later): inside a controlled greenhouse, crops, fruit trees and berry bushes use annual-average temperature and hydration and ignore outside weather.
- Datapack integration: a separate "Datapack Compatibility Guide" is provided on GitHub for modpack authors who want to add fauna spawning, extend fauna entries, or coordinate AFC compatibility.

Aimed at modpacks that cannot upgrade to 1.21 yet still want the newer content.

License Notice
This mod is a derivative work of TerraFirmaCraft (TFC).
- Code: licensed under EUPL v1.2 (or, at your option, any later version).
- Art / data assets: licensed under CC BY-SA 4.0.
Third parties redistributing this mod must comply with the EUPL v1.2 and CC BY-SA 4.0 obligations (attribution, copyleft / share-alike, source-code provision).
See the bundled LICENSE, NOTICE and DISCLAIMER.md for the full terms.
'''

