description = '''
TerraFirmaEarth / 群峦地球

面向 Minecraft 1.20.1 Forge 的 TerraFirmaCraft 附属模组。把高版本 TFC 的新地形与新内容反向移植到 1.20，让因依赖锁定无法升级 1.21 的玩家、服务器和整合包也能体验到。

移植自高版本 TFC 的内容
- 积雪逻辑移植，积雪现在是在对应的气候立即生效，冬天外出不会慢慢积雪，夏天外出不会慢慢化雪。
- 新版地形地貌和过渡：在既有地形基础上继续补齐海岭、裂谷、河谷、环礁、火山弧与火山岛等 4.2.9 地形入口。
- 气候与季节：新的气候(总共31种)与面板日历显示、运行时天气与降雨判定。
- 植物季相：树叶、花草、莲花、向日葵等的动态季相外观(风景美化)。
- 作物与农田杂草花朵：完整移植.
- 新生物与刷新：野牛、海豹等新生物按高版本气候口径接入；北极熊、冰原狼按高版本气候口径运行。
- 害虫系统：跟随气候变化的多种老鼠。
- 手册条目：在 TFC 手册首页新增"群峦地球 / New Terra Earth"独立分类，比较粗糙，拿来查看作物生长条件。

额外的内容
- 果树作物灌木等湿度，直接取决于当前降雨量，且可以读取环境水源。
- 海洋地形：采用 TFC 4.2.9 的普通海、海礁、深海和新版海沟高度噪声；TFE 仍保留深水海床薄砂砾与火山海岸表面适配。
- 区域地形：补齐 ocean ridge、rift valley、river valley、环礁和基础 stratovolcano centered-feature；TFE 的地势溪流与河床保护继续叠加。
- 高低版本兼容层：让高版本的生物、气候、植物等数据在 1.20 端正常工作，兼容了1.20提前注册的物品。
- AFC 兼容：兼容林海传说
- 地图mod 兼容。
- FirmalifeEnhanced 温室地窖重置兼容,温室范围内，作物、果树、浆果灌木等会按年均温度和湿度判定，不受外部天气影响。
- TFCModernLife群峦现代化生活兼容：温室范围是以当前温度为基准进行控温。且建议使用此模组作为本模组温室、地窖和电力厨房相关拓展，勿重复启用.
- 数据包接入说明：随附 GitHub 上的《数据包兼容写法教程》，方便个人使用者或整合包作者添加生物刷新、追加 fauna、协调 AFC 兼容。

2.0.2 更新概括
- 新增作物健康机制：温度或湿度不适时作物停止生长并逐步降低健康，气候恢复后逐步恢复；健康归零或温度超出适宜范围10°C时枯死,TFE帕秋莉作物重做篇有介绍。
- Jade 信息面板新增作物健康显示。
- 香蕉每次收获改为 8 - 16 个，营养调整为 1.5 点水果和 0.5 点乳制品；直接破坏果树时树苗掉落增加为1-3个。
- 修复芦竹、干芦苇和树蕨从底部破坏时，中间节不掉落的问题。

2.0.1 更新概括
- 新增全新的河流群系溪流。
- 减少河流群系高岸上的砂砾。
- 修复死亡不掉落时，手持锤子和凿子对准石块死亡可能导致的崩溃。
- 重做勘探系统，具体机制请查看帕秋莉手册。
- 重做船的浮力，现在船可以沿水流上升。
- 重做全部作物的气候条件，具体数据请查看帕秋莉手册。
- 重做全局温度算法,见帕秋莉。
- 优化 TFE 的帕秋莉手册。
- 修复其他若干问题。
 
1.1.3 更新概括
- 海洋的淤泥海床替换为更浅的砂砾海床。
- 将注册进tfc的物品带上tfe的标记，jei上搜索@tfe也能显示本mod的全部物品了。

1.1.2 更新概括
- 修复沿海沙滩等地形生成异常。
- 优化火山的地势选择。
- 优化木薯营养值。
- 灌木和果树的生长条件对齐 1.21，并额外将温度需求改为当前温度。
- 气候不适宜不再导致灌木和果树树苗死亡，而是停止生长。
- TFCModernLife群峦现代化生活兼容：温室范围是以当前温度为基准进行控温。且建议使用此模组作为本模组温室、地窖和电力厨房相关拓展，勿重复启用.

1.1.1 更新概括
- 修复香蕉树自然生成时底部可能插进土里的问题。
- 修复凝灰岩砂砾陶盘阶段模型显示异常。
- 修复炉灶锅液面、产物与锅内物品客户端显示位置异常。
- 增强小萝卜，栽培成熟收获产量翻倍。
- 调整平均湿度提示，参考值不再显示太高 / 太低警告。

1.1.0 更新概括
- 高阶地地形优化。
- 修复山区河道入海口概率被堵的问题。
- 平滑山体山峰生成。
- 森林生成更匹配地形。
- 高岭土刷新在腐殖土内时增加一层高岭土草方块覆盖。

1.0.2 更新概括
- 增加了自由放置木堆。
- 修复了浮空树，浮空腐殖土。去掉了死火山的地势。补全了水生成逻辑水-死火山水坑生成较少的问题.

1.0.1 更新概括
- 新增 TFC 结构与森林树池兼容修复，改善 TFC Structures / AFC 等联动下的树配置、森林层与腐殖层表现。
- 补齐和修复一批移植植物贴图、模型与地物资源。
- 新增山区地势设计，修复水下浮空石锥，并开放相关地势配置。
- 补充仙人掌木材循环、仙人掌整株砍伐掉落、炉灶 / 炉灶锅移植与红木等地物兼容。
- 新增地下河与普通河流切割过渡层，减少洞口和河谷交界处的硬切线。
- 修复旧存档或外部数据包导致的群系兼容崩溃，并修正作物湿度范围与耕地平均湿度显示。
- 重写苜蓿和油菜用途：苜蓿可作为更多常见动物饲料，油菜新增油菜籽榨油路线。

